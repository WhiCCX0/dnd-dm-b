name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - '22.13'
          - '24'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache compiled rules database
        id: db-cache
        uses: actions/cache@v6
        with:
          path: |
            references/rules.db
            references/topics_index.json
            references/dedup-report.json
          key: rules-db-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('references/db-manifest.json', 'scripts/build-index.js', 'scripts/build-db.js', 'scripts/setup-db.js') }}

      - name: Prepare rules database
        run: npm run setup-db

      - name: Run automated tests
        run: npm test
